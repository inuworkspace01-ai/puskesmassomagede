name: Retry Vercel after deployment limit

on:
  schedule:
    # Check once per hour, offset from the top of the hour to reduce scheduler delays.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until Vercel Hobby limit should be reset
        id: gate
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          target = datetime.fromisoformat('2026-09-09T06:00:00+00:00')
          now = datetime.now(timezone.utc)
          print(f'UTC now: {now.isoformat()}')
          print(f'Target:  {target.isoformat()}')
          if now < target:
              print('WAIT')
              raise SystemExit(0)
          print('READY')
          with open('/tmp/ready', 'w') as f:
              f.write('1')
          PY
          if [ -f /tmp/ready ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create exactly one fresh commit for Vercel
        if: steps.gate.outputs.ready == 'true'
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/retry-vercel-after-limit.yml
          printf 'Vercel deployment retry marker: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .vercel-deploy-retry-marker
          git add -A
          git commit -m "chore: retry production deployment after Vercel limit reset"
          git push origin main
