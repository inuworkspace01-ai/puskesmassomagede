name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Android SDK for Bubblewrap
        run: |
          set -e
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH"
          test -d "$JAVA_HOME"
          test -d "$ANDROID_SDK_PATH"

          # GitHub-hosted runners use modern cmdline-tools layout. Bubblewrap
          # expects sdkmanager to be discoverable from the SDK root and needs
          # Build Tools 34.0.0 available before its environment validation.
          if [ ! -e "$ANDROID_SDK_PATH/bin" ] && [ -d "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" ]; then
            ln -s "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" "$ANDROID_SDK_PATH/bin"
          fi

          SDKMANAGER="$ANDROID_SDK_PATH/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_PATH"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

          # Do not fail the job on Bubblewrap's legacy doctor check; the SDK
          # components required by the build have been installed explicitly.
          bubblewrap doctor || true

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias puskesmas \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temporary-build-password \
              -keypass temporary-build-password \
              -dname "CN=Puskesmas Somagede, OU=IT, O=Puskesmas Somagede, L=Banyumas, ST=Jawa Tengah, C=ID"
          fi

      - name: Generate TWA project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_PASSWORD" ]; then KS_PASSWORD="$KEYSTORE_PASSWORD"; else KS_PASSWORD="temporary-build-password"; fi
          if [ -n "$KEY_PASSWORD" ]; then K_PASSWORD="$KEY_PASSWORD"; else K_PASSWORD="temporary-build-password"; fi
          cat > android/twa-manifest.json <<EOF
          {
            "packageId": "id.go.puskesmassomagede.portal",
            "host": "puskesmas-somagede-inuu.vercel.app",
            "name": "Puskesmas Somagede",
            "launcherName": "Puskesmas Somagede",
            "display": "standalone",
            "themeColor": "#0f766e",
            "themeColorDark": "#062e2b",
            "navigationColor": "#0f766e",
            "navigationColorDark": "#062e2b",
            "navigationDividerColor": "#0f766e",
            "navigationDividerColorDark": "#062e2b",
            "backgroundColor": "#f7fffd",
            "startUrl": "/",
            "iconUrl": "https://puskesmas-somagede-inuu.vercel.app/assets/logo-puskesmas-somagede.jpeg",
            "webManifestUrl": "https://puskesmas-somagede-inuu.vercel.app/manifest.webmanifest",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "../android.keystore", "alias": "puskesmas" },
            "appVersionName": "1.0.${{ github.run_number }}",
            "appVersionCode": ${{ github.run_number }},
            "minSdkVersion": 23,
            "orientation": "portrait"
          }
          EOF
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KS_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$K_PASSWORD"
          cd android
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            export BUBBLEWRAP_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export BUBBLEWRAP_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            export BUBBLEWRAP_KEYSTORE_PASSWORD="temporary-build-password"
            export BUBBLEWRAP_KEY_PASSWORD="temporary-build-password"
          fi
          cd android
          yes | bubblewrap build --manifest=twa-manifest.json --signingKeyPath="../android.keystore" --signingKeyAlias=puskesmas --skipPwaValidation
          cp app-release-signed.apk ../puskesmas-somagede.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest puskesmas-somagede.apk \
            --title "Puskesmas Somagede Android" \
            --notes "APK Android terbaru untuk Portal Puskesmas Somagede. Dibangun otomatis dari branch main." \
            --latest
