name: Android Play Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        required: true
        default: internal
        type: choice
        options: [internal, closed, production]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Require production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          test -n "$PLAY_JSON" || { echo 'Missing PLAY_SERVICE_ACCOUNT_JSON'; exit 1; }

      - name: Prepare signing key and Play service account
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android.keystore
          printf '%s' "$PLAY_JSON" > play-service-account.json

      - name: Configure Bubblewrap
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit)"
          SDK_BIN_DIR="$(dirname "$SDKMANAGER")"
          if [ ! -e "$SDK/bin" ]; then ln -s "$SDK_BIN_DIR" "$SDK/bin"; fi
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$SDK"}
          EOF
          bubblewrap doctor || true

      - name: Generate TWA manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          cat > twa-manifest.json <<EOF
          {
            "packageId": "id.go.puskesmassomagede.portal",
            "host": "puskesmas-somagede-inuu.vercel.app",
            "name": "Puskesmas Somagede",
            "launcherName": "Puskesmas Somagede",
            "display": "standalone",
            "themeColor": "#0f766e",
            "themeColorDark": "#062e2b",
            "navigationColor": "#0f766e",
            "navigationColorDark": "#062e2b",
            "navigationDividerColor": "#0f766e",
            "navigationDividerColorDark": "#062e2b",
            "backgroundColor": "#f7fffd",
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/inuworkspace01-ai/puskesmassomagede/main/public/assets/logo-puskesmas-somagede.jpeg",
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": true,
            "signingKey": {"path":"android.keystore","alias":"puskesmas"},
            "appVersionName": "$VERSION",
            "appVersionCode": ${{ github.run_number }},
            "minSdkVersion": 23,
            "orientation": "portrait"
          }
          EOF
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$KEY_PASSWORD"
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade
          # Google Play requires API 36+ for new apps and updates from 31 Aug 2026.
          sed -i -E 's/(compileSdkVersion[[:space:]]+)[0-9]+/\136/' android/app/build.gradle || true
          sed -i -E 's/(targetSdkVersion[[:space:]]+)[0-9]+/\136/' android/app/build.gradle || true

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$KEY_PASSWORD"
          cd android
          bubblewrap build --manifest=twa-manifest.json --signingKeyPath="../android.keystore" --signingKeyAlias=puskesmas --skipPwaValidation
          test -f app-release-bundle.aab
          cp app-release-bundle.aab ../puskesmas-somagede.aab

      - name: Publish to Google Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TRACK="${{ github.event.inputs.track || 'internal' }}"
          bubblewrap play publish \
            --serviceAccountFile="play-service-account.json" \
            --track="$TRACK" \
            --appBundleLocation="$GITHUB_WORKSPACE/puskesmas-somagede.aab"

      - name: Update web release version for in-app update notice
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > public/app-version.json <<EOF
          {"version":"$VERSION","updatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","playStoreUrl":"https://play.google.com/store/apps/details?id=id.go.puskesmassomagede.portal"}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app-version.json
          git commit -m "chore: publish app version $VERSION" || true
          git push origin HEAD:main || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: puskesmas-somagede-aab
          path: puskesmas-somagede.aab
